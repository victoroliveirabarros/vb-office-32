<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preload" href="/fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>vb-office-32</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="status" class="pill brand status" hidden></div>
    <div id="latency" class="pill brand latency" hidden></div>
    <div class="hud-corner">
      <button id="logout" class="button brand logout" type="button" hidden>
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#log-out" /></svg><span class="logout-text">Sair</span>
      </button>
      <button id="avatar-edit" class="button brand avatar-edit" type="button" aria-haspopup="dialog" hidden disabled>
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#shirt" /></svg><span class="avatar-edit-text">Personalizar</span>
      </button>
      <div id="zone" class="pill brand zone-strip" hidden></div>
    </div>
    <div id="zone-status" class="sr-only" role="status"></div>
    <div id="media-tiles" hidden></div>
    <div id="media-stage" hidden><span id="media-stage-label"></span></div>
    <div id="media-bar" class="brand" hidden>
      <button id="media-mic" class="media-button" type="button" aria-pressed="false">
        <svg class="icon icon-on" aria-hidden="true"><use href="/icons.svg#mic" /></svg>
        <svg class="icon icon-off" aria-hidden="true"><use href="/icons.svg#mic-off" /></svg>
      </button>
      <button id="media-camera" class="media-button" type="button" aria-pressed="false">
        <svg class="icon icon-on" aria-hidden="true"><use href="/icons.svg#video" /></svg>
        <svg class="icon icon-off" aria-hidden="true"><use href="/icons.svg#video-off" /></svg>
      </button>
      <button id="media-screen" class="button media-screen" type="button" aria-pressed="false" hidden>
        <svg class="icon icon-on" aria-hidden="true"><use href="/icons.svg#screen-share-off" /></svg>
        <svg class="icon icon-off" aria-hidden="true"><use href="/icons.svg#screen-share" /></svg>
        <span id="media-screen-text" class="media-screen-text">Compartilhar tela</span>
      </button>
      <button id="media-unlock" class="button button-primary" type="button" hidden>
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#volume-2" /></svg><span>Ativar áudio</span>
      </button>
      <span id="media-note" hidden></span>
    </div>
    <div id="media-audio" hidden></div>
    <aside id="chat" class="chat" aria-label="Chat" hidden>
      <button id="chat-toggle" class="brand chat-toggle" type="button" aria-expanded="false" aria-controls="chat-panel">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#message-circle" /></svg><span>Chat</span><span id="chat-toggle-badge" class="chat-badge" aria-hidden="true" hidden></span>
      </button>
      <section id="chat-panel" class="chat-panel" hidden>
        <div class="brand chat-header">
          <div id="chat-tabs" class="chat-tabs" role="tablist" aria-label="Conversas"></div>
          <button id="chat-close" class="icon-button chat-close" type="button" aria-label="Fechar chat" title="Fechar chat">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#x" /></svg>
          </button>
        </div>
        <button id="chat-people-toggle" class="chat-people-toggle" type="button" aria-expanded="false" aria-controls="chat-people">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#users" /></svg><span id="chat-people-count">Presentes</span>
        </button>
        <div id="chat-people" class="chat-people" hidden>
          <ul id="chat-roster" class="chat-roster" aria-label="Presentes"></ul>
        </div>
        <div id="chat-tabpanel" class="chat-tabpanel" role="tabpanel">
          <div class="chat-notice-row">
            <p id="chat-notice" class="chat-notice"></p>
            <button id="chat-dm-close" class="button button-ghost chat-dm-close" type="button" hidden>
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#x" /></svg><span>Fechar conversa</span>
            </button>
          </div>
          <div id="chat-log" class="chat-log" role="log" aria-label="Mensagens" aria-busy="false" tabindex="0"></div>
        </div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" class="chat-input" rows="2" dir="auto" aria-label="Mensagem" aria-describedby="chat-status" placeholder="Mensagem (Enter envia, Shift+Enter quebra linha)"></textarea>
          <div class="chat-meta">
            <span id="chat-status" class="chat-status" role="status"></span>
            <span id="chat-count" class="chat-count" aria-hidden="true">0/500</span>
            <button id="chat-send" class="button button-primary chat-send" type="submit">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#send" /></svg><span>Enviar</span>
            </button>
          </div>
        </form>
      </section>
    </aside>
    <dialog id="avatar-editor" class="editor" aria-labelledby="avatar-editor-title">
      <form class="editor-form" method="dialog">
        <div class="editor-header">
          <h2 id="avatar-editor-title" class="editor-title">Personalizar avatar</h2>
          <button id="avatar-close" class="icon-button" type="button" aria-label="Fechar sem salvar" title="Fechar sem salvar">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#x" /></svg>
          </button>
        </div>
        <div class="editor-body">
          <div class="editor-preview">
            <canvas id="avatar-preview" class="editor-canvas" width="64" height="96" role="img" aria-label="Prévia do avatar"></canvas>
            <button id="avatar-turn" class="button button-ghost editor-turn" type="button">Girar</button>
          </div>
          <div id="avatar-options" class="editor-options"></div>
        </div>
        <div class="editor-actions">
          <button id="avatar-random" class="button button-ghost" type="button">Aleatório</button>
          <button id="avatar-cancel" class="button editor-cancel" type="button">Cancelar</button>
          <button id="avatar-save" class="button button-primary" type="submit" value="save">Salvar</button>
        </div>
      </form>
    </dialog>
    <div id="login" class="overlay" hidden>
      <div class="card">
        <h1 class="card-title">vb-office-32</h1>
        <p class="card-text">Entre com a conta da empresa para chegar ao escritório.</p>
        <a class="button button-primary" href="/auth/login">Entrar</a>
      </div>
    </div>
    <div id="join" class="overlay" hidden>
      <form id="join-form" class="card">
        <h1 class="card-title">vb-office-32</h1>
        <label class="field-label" for="join-name">Seu nome</label>
        <input id="join-name" class="field" maxlength="24" autocomplete="nickname" required />
        <p id="join-error" class="field-error" hidden>
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#circle-alert" /></svg><span>Use 1–24 caracteres: letras, números, espaço, _ ou -.</span>
        </p>
        <button class="button button-primary" type="submit">Entrar</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
