name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  livekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker run -d --name livekit --network host livekit/livekit-server:v1.13 --dev --bind 127.0.0.1
      - run: timeout 60 sh -c 'until curl -fs http://localhost:7880 >/dev/null; do sleep 1; done'
      - run: go test -count=1 -run LiveKit -v ./internal/media
        env:
          VB_OFFICE32_LIVEKIT_TEST_URL: http://localhost:7880
      - if: failure()
        run: docker logs livekit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
